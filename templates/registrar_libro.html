
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de libros</title>
</head>
<body>

    <h2>Registrar nuevo libro</h2>

    <label>Título:</label>
    <input type="text" id="titulo">
    <br><br>

    <label>Autor:</label>
    <input type="text" id="autor">

    <br><br>

    <button onclick="registrarLibro()">
        Registrar libro
    </button>

    <p id="mensaje"></p>

    <script src="{{ url_for('static', filename='biblioteca.js') }}"></script>

</body>
</html>
